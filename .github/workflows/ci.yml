name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: "Which test suite to run"
        type: choice
        options:
          - smoke
          - full
        default: smoke

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck init.sh

  smoke:
    # Pushes/PRs: always. Manual runs: only when "smoke" was picked.
    # Scheduled runs: skipped (schedule means full).
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      inputs.suite == 'smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: printf 'n\ny\ny\ny\n' | ./init.sh
      - run: |
          test -L "$HOME/.config/nvim"
          test -L "$HOME/.config/btop"
          test -L "$HOME/.config/tmux"
          test -L "$HOME/.vimrc"
          grep -qF ". $GITHUB_WORKSPACE/.bashrc" "$HOME/.bashrc"

  full:
    # Weekly schedule, or manual runs that picked "full".
    if: >-
      github.event_name == 'schedule' ||
      inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 90 # hung builds shouldn't burn runner time forever
    steps:
      - uses: actions/checkout@v5
      - run: ./init.sh --yes
      - run: ./init.sh --yes # second run must also pass: the idempotency test